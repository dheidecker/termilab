services:
  db:
    image: postgres:16-alpine
    container_name: termilab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: termilab
      POSTGRES_USER: termilab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termilab -d termilab"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: termilab-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://termilab:${DB_PASSWORD}@db:5432/termilab
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BASE_URL: ${BASE_URL:-}
      PORT: 8110
    ports:
      - "8110:8110"
    depends_on:
      db:
        condition: service_healthy
